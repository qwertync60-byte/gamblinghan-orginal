<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Mandat Royale</title>
<style>
:root{
  --bg:#0a0612;
  --bg2:#130b22;
  --panel:rgba(22,15,38,.78);
  --panel2:rgba(34,21,55,.92);
  --gold:#ffd77b;
  --gold2:#d69a2b;
  --text:#fff7dc;
  --muted:#cab894;
  --line:rgba(255,215,123,.16);
  --win:#29d47f;
  --lose:#ff5a7d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#2a174d 0,#12091f 35%,var(--bg) 80%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,214,123,.14),transparent 28%),
    radial-gradient(circle at 80% 0%,rgba(122,94,255,.13),transparent 25%),
    linear-gradient(rgba(255,255,255,.03),transparent);
}
.wrap{width:min(1120px,100%);margin:0 auto;padding:16px}
.hero{
  border:1px solid var(--line);
  border-radius:28px;
  padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  box-shadow:0 24px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(16px);
}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:56px;height:56px;border-radius:18px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#ffe3a8,#be7d13);
  color:#261204;font-size:30px;font-weight:1000;
  box-shadow:0 14px 28px rgba(214,154,43,.28)
}
.title{font-size:clamp(24px,4vw,40px);font-weight:1000;line-height:1}
.sub{margin-top:6px;font-size:13px;color:var(--muted)}
.tag{
  border:1px solid rgba(255,215,123,.2);
  background:rgba(255,215,123,.08);
  color:var(--gold);
  border-radius:999px;
  padding:10px 14px;
  font-size:13px;
  font-weight:800
}
.stats{
  margin-top:14px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px
}
.card{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,var(--panel),rgba(13,8,22,.94));
  padding:14px
}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:20px;font-weight:1000;margin-top:4px}
.main{
  margin-top:14px;
  display:grid;grid-template-columns:1.1fr .9fr;gap:12px
}
@media(max-width:940px){.main{grid-template-columns:1fr}}
.panel{
  border:1px solid var(--line);
  border-radius:24px;
  background:linear-gradient(180deg,var(--panel2),rgba(18,11,33,.96));
  padding:16px;
  box-shadow:0 18px 42px rgba(0,0,0,.24)
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
select,input{
  width:100%;border-radius:16px;border:1px solid rgba(255,215,123,.18);
  background:rgba(255,255,255,.06);color:var(--text);
  padding:14px 14px;font-size:16px;outline:none
}
select:focus,input:focus{border-color:rgba(255,215,123,.66);box-shadow:0 0 0 4px rgba(255,215,123,.10)}
.betset{
  margin-top:12px;
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px
}
@media(max-width:640px){.betset{grid-template-columns:repeat(3,1fr)}}
@media(max-width:420px){.betset{grid-template-columns:repeat(2,1fr)}}
.chip{
  border:none;border-radius:14px;padding:10px 0;
  background:linear-gradient(180deg,#f7df9b,#b97713);
  color:#271304;font-weight:900
}
.actions{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:12px}
@media(max-width:640px){.actions{grid-template-columns:1fr}}
.primary,.secondary{
  border:none;border-radius:18px;padding:16px 18px;font-weight:1000
}
.primary{
  color:#240f02;
  background:linear-gradient(180deg,#ffeaa9,#cf8a18);
  box-shadow:0 14px 30px rgba(207,138,24,.25)
}
.secondary{
  color:var(--text);
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,215,123,.16)
}
.games{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px
}
@media(max-width:640px){.games{grid-template-columns:repeat(2,1fr)}}
.game{
  border:none;border-radius:18px;padding:15px 12px;
  background:rgba(255,255,255,.06);
  color:var(--text);font-weight:900;border:1px solid rgba(255,215,123,.14)
}
.game.active{
  background:linear-gradient(180deg,rgba(255,215,123,.22),rgba(255,255,255,.05));
  border-color:rgba(255,215,123,.5);
  box-shadow:0 12px 24px rgba(255,215,123,.08)
}
.screen{
  min-height:280px;
  border-radius:22px;
  border:1px solid rgba(255,215,123,.16);
  background:
    radial-gradient(circle at 50% 35%,rgba(255,215,123,.16),transparent 52%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  display:grid;place-items:center;text-align:center;position:relative;overflow:hidden
}
.screen:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);
  transform:translateX(-120%);
  animation:shine 5s linear infinite
}
@keyframes shine{to{transform:translateX(120%)}}
.result{font-size:clamp(34px,8vw,76px);font-weight:1000;letter-spacing:4px}
.msg{margin-top:12px;color:var(--muted);font-size:14px;max-width:420px;padding:0 10px}
.admin{display:none;margin-top:14px}
.admin.open{display:block}
.adminbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pill{
  border:1px solid rgba(255,215,123,.18);
  background:rgba(255,215,123,.08);
  color:var(--gold);
  border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800
}
.adminrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px}
@media(max-width:520px){.adminrow{grid-template-columns:1fr}}
.footer{margin-top:14px;text-align:center;font-size:12px;color:rgba(255,247,220,.56)}
.flash-win{animation:win .65s ease}
.flash-lose{animation:lose .5s ease}
@keyframes win{50%{transform:scale(1.03)}}
@keyframes lose{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="top">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <div class="title">Mandat Royale</div>
          <div class="sub">Очень красивая демо-версия с мандатами, анимацией и 6 играми</div>
        </div>
      </div>
      <div class="tag">Виртуальная валюта • локальное сохранение</div>
    </div>

    <div class="stats">
      <div class="card"><div class="k">Баланс</div><div class="v" id="bal">0</div></div>
      <div class="card"><div class="k">Выиграно</div><div class="v" id="won">0</div></div>
      <div class="card"><div class="k">Проиграно</div><div class="v" id="lost">0</div></div>
      <div class="card"><div class="k">Раунды</div><div class="v" id="games">0</div></div>
    </div>

    <div class="main">
      <section class="panel">
        <div class="row">
          <div>
            <label>Игра</label>
            <select id="game">
              <option value="slot1">Golden Eclipse Slot</option>
              <option value="slot2">Pharaoh Neon Slot</option>
              <option value="wheel">Lucky Wheel</option>
              <option value="dice">Dice Storm</option>
              <option value="roulette">Roulette Pulse</option>
              <option value="blackjack">Blackjack Royale</option>
            </select>
          </div>
          <div>
            <label>Ставка в мандатах</label>
            <input id="bet" type="number" min="5" max="500000" value="50">
          </div>
        </div>

        <div class="betset">
          <button class="chip" data-bet="5">5</button>
          <button class="chip" data-bet="10">10</button>
          <button class="chip" data-bet="25">25</button>
          <button class="chip" data-bet="50">50</button>
          <button class="chip" data-bet="100">100</button>
          <button class="chip" data-bet="500">500</button>
        </div>

        <div class="actions">
          <button class="primary" id="spin">SPIN / КРУТИТЬ</button>
          <button class="secondary" id="reset">Сбросить счёт</button>
        </div>

        <div class="games">
          <button class="game active" data-game="slot1">Golden Eclipse</button>
          <button class="game" data-game="slot2">Pharaoh Neon</button>
          <button class="game" data-game="wheel">Lucky Wheel</button>
          <button class="game" data-game="dice">Dice Storm</button>
          <button class="game" data-game="roulette">Roulette Pulse</button>
          <button class="game" data-game="blackjack">Blackjack Royale</button>
        </div>

        <div class="admin" id="admin">
          <div class="adminbar">
            <div class="pill">Админ-панель</div>
            <button class="secondary" id="closeAdmin">Закрыть панель</button>
          </div>
          <div class="adminrow">
            <input id="code" type="password" placeholder="Код панели">
            <button class="secondary" id="enterAdmin">Войти</button>
          </div>
          <div class="adminrow" id="adminTools" style="display:none">
            <input id="amount" type="number" min="0" max="500000" placeholder="Сумма">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <button class="secondary" id="addM">+ Мандаты</button>
              <button class="secondary" id="subM">- Мандаты</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="screen" id="screen">
          <div>
            <div class="result" id="result">MANDAT</div>
            <div class="msg" id="msg">Выбери игру и нажми SPIN</div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <div class="footer">70% проигрыш • 25% выигрыш • 5% нейтрально • демо-режим</div>
</div>

<script>
const ADMIN_CODE="666444787";
const START_BAL=500000, MAX_BAL=500000;
const $=id=>document.getElementById(id);
const st={
  bal:+localStorage.getItem("r_bal")||START_BAL,
  won:+localStorage.getItem("r_won")||0,
  lost:+localStorage.getItem("r_lost")||0,
  games:+localStorage.getItem("r_games")||0
};
let ac=null;
function save(){localStorage.setItem("r_bal",st.bal);localStorage.setItem("r_won",st.won);localStorage.setItem("r_lost",st.lost);localStorage.setItem("r_games",st.games)}
function fmt(n){return Math.floor(n).toLocaleString("ru-RU")}
function update(){
  $("bal").textContent=fmt(st.bal)+" мандатов";
  $("won").textContent=fmt(st.won);
  $("lost").textContent=fmt(st.lost);
  $("games").textContent=fmt(st.games);
  save();
}
function sound(type){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!ac)ac=new AC();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="triangle";
    o.frequency.value=type==="win"?920:type==="lose"?170:420;
    g.gain.value=.0001;
    o.connect(g);g.connect(ac.destination);
    const t=ac.currentTime;
    g.gain.exponentialRampToValueAtTime(.12,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.start(t);o.stop(t+.2);
  }catch(e){}
}
function flash(win){
  const s=$("screen");
  s.classList.remove("flash-win","flash-lose");
  void s.offsetWidth;
  s.classList.add(win===null?"":win?"flash-win":"flash-lose");
}
function setResult(text,win){
  $("result").textContent=text;
  flash(win);
  sound(win===null?"neutral":win?"win":"lose");
}
function setMsg(t){$("msg").textContent=t}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function outcome(){const r=Math.random(); return r<0.70?"lose":r<0.95?"win":"neutral"}
function mult(){return [2,2,3,5,10][rnd(0,4)]}
function play(){
  const bet=Math.max(5,Math.min(MAX_BAL,Number($("bet").value)||0));
  if(bet>st.bal){setMsg("Недостаточно мандатов.");return}
  st.games++;
  const game=$("game").value, o=outcome();
  if(o==="lose"){
    st.bal-=bet; st.lost+=bet;
    setResult("LOST",false);
    setMsg(`Проигрыш ${fmt(bet)} мандатов. Шанс не на твоей стороне.`);
  }else if(o==="win"){
    const m=mult(), p=bet*m;
    st.bal=Math.min(MAX_BAL,st.bal-bet+p);
    st.won+=p;
    setResult("X"+m,true);
    setMsg(`Выигрыш ${fmt(p)} мандатов. Ставка ${fmt(bet)} × ${m}.`);
  }else{
    setResult("NEUTRAL",null);
    setMsg("Нейтральный раунд. Баланс не изменился.");
  }
  update()
}
document.querySelectorAll(".game").forEach(b=>b.onclick=()=>{$("game").value=b.dataset.game;document.querySelectorAll(".game").forEach(x=>x.classList.toggle("active",x===b))});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>$("bet").value=b.dataset.bet);
$("spin").onclick=play;
$("reset").onclick=()=>{if(confirm("Сбросить баланс и статистику?")){st.bal=START_BAL;st.won=0;st.lost=0;st.games=0;setResult("MANDAT",null);setMsg("Счёт сброшен.");update()}};
$("enterAdmin").onclick=()=>{$("adminTools").style.display=$("code").value===ADMIN_CODE?"grid":"none";setMsg($("code").value===ADMIN_CODE?"Панель открыта.":"Неверный код.");$("code").value=""};
$("closeAdmin").onclick=()=>{$("adminTools").style.display="none";$("admin").classList.remove("open");$("code").value="";$("amount").value="";setMsg("Панель закрыта. Код потребуется снова.")};
$("addM").onclick=()=>{const a=+$("amount").value||0;if(a<=0)return setMsg("Введи сумму.");st.bal=Math.min(MAX_BAL,st.bal+a);setMsg(`Добавлено ${fmt(a)} мандатов.`);update()};
$("subM").onclick=()=>{const a=+$("amount").value||0;if(a<=0)return setMsg("Введи сумму.");st.bal=Math.max(0,st.bal-a);setMsg(`Списано ${fmt(a)} мандатов.`);update()};
setInterval(save,3000);
update();
</script>
</body>
  </html>
